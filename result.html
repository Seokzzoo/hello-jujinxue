<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BONO 편지가 도착했습니다! 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Jua", sans-serif;
      }

      body {
        background-color: #fdf5e6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        border-radius: 30px;
        padding: 35px 24px 28px;
        box-shadow: 0 12px 30px rgba(230, 180, 150, 0.25);
        border: 3.5px solid #f6ded0;
        text-align: center;
      }

      .BONO-box {
        width: 120px;
        height: 120px;
        margin: 0 auto 10px;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .BONO-box:active {
        transform: scale(0.92);
      }

      .BONO-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.06));
      }

      .status-text {
        font-size: 1.15rem;
        color: #9c847d;
        margin-bottom: 20px;
      }

      /* 편지 봉투 영역 */
      .envelope-box {
        background: #fff9f4;
        border: 2px dashed #f5c4b2;
        border-radius: 20px;
        padding: 26px 18px;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }

      .envelope-box:hover {
        background: #fff4ec;
        transform: translateY(-2px);
      }

      .envelope-icon {
        font-size: 3.4rem;
        animation: wiggle 1.8s infinite ease-in-out;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-8deg);
        }
        75% {
          transform: rotate(8deg);
        }
      }

      .tap-hint {
        font-size: 1.1rem;
        color: #e57d62;
        margin-top: 8px;
      }

      /* 편지 열었을 때 메시지 */
      .message-content {
        display: none;
        font-size: 1.65rem;
        color: #3b2a26;
        line-height: 1.5;
        word-break: break-word;
        white-space: pre-wrap;
        animation: popOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popOpen {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .btn-create-own {
        display: none;
        width: 100%;
        padding: 14px;
        margin-top: 18px;
        border: none;
        border-radius: 18px;
        background-color: #ffd86b;
        color: #5d4037;
        font-size: 1.25rem;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 216, 107, 0.5);
        transition:
          transform 0.15s,
          background-color 0.2s;
      }

      .btn-create-own:hover {
        background-color: #ffce4b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="BONO-box">
        <img src="bono.png" style="width: 100px; height: auto" alt="BONO" />
      </div>

      <p class="status-text" id="status-desc">💌 BONO가 전할 말이 있대요!</p>

      <div class="envelope-box" id="envelope-box">
        <div id="unopened">
          <div class="envelope-icon">✉️</div>
          <div class="tap-hint">터치해서 열어보기</div>
        </div>
        <div class="message-content" id="message-text"></div>
      </div>

      <button class="btn-create-own" id="btn-create-own">나도 메시지 만들기 🥕</button>
    </div>

    <script>
      // URL Hash(#c=...) 데이터 디코딩
      function decodeMessage() {
        try {
          const hash = window.location.hash.substring(1)

          // "c=" 뒤의 전체 문자열을 그대로 가져옴
          const prefix = "c="
          if (!hash.startsWith(prefix)) return null
          const encoded = hash.slice(prefix.length)

          if (!encoded) return null

          const binary = atob(encoded)
          const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0))
          const json = JSON.parse(new TextDecoder().decode(bytes))
          return json.m || ""
        } catch (e) {
          return null
        }
      }

      const message = decodeMessage()
      const envelope = document.getElementById("envelope-box")
      const unopened = document.getElementById("unopened")
      const messageText = document.getElementById("message-text")
      const statusDesc = document.getElementById("status-desc")
      const btnCreateOwn = document.getElementById("btn-create-own")

      let isOpened = false

      if (!message) {
        statusDesc.textContent = "편지가 비어있거나 찾을 수 없어요 😢"
        unopened.querySelector(".tap-hint").textContent = "새 편지 작성하러 가기"
        envelope.addEventListener("click", () => {
          window.location.href = "index.html"
        })
      } else {
        envelope.addEventListener("click", () => {
          if (isOpened) return
          isOpened = true

          unopened.style.display = "none"
          messageText.textContent = message
          messageText.style.display = "block"
          statusDesc.textContent = "BONO의 편지가 열렸어요! ✨"
          btnCreateOwn.style.display = "block"

          confetti({
            particleCount: 75,
            spread: 65,
            origin: { y: 0.6 },
          })
        })
      }

      btnCreateOwn.addEventListener("click", () => {
        window.location.href = "index.html"
      })
    </script>
  </body>
</html>
